name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
        exclude:
          # 3.9 is the floor we promise; testing it on one OS is enough.
          - os: windows-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install pytest
        run: python -m pip install --quiet pytest

      - name: run tests
        run: python -m pytest tests/ -q

      - name: the tool must run with no packages installed at all
        # The release binaries bundle nothing but the stdlib, so a stdlib-only
        # run is the thing that actually has to work. pytest is a test-time
        # dependency, not a runtime one, and this step proves it. The last
        # line proves this Python carries Tk, which the window needs and
        # which the release build must find.
        shell: bash
        run: |
          python dirarttool.py --version
          python dirarttool.py tests/fixtures/baracuda-dir-file.d64 \
            --replace D6=D1 --replace D7=D1 --dry-run
          python -c "import tkinter; print('tkinter', tkinter.TkVersion)"
