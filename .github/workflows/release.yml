name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            binary: dirarttool
            strip: "--strip"
          - os: windows-latest
            target: windows
            binary: dirarttool.exe
            strip: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Oldest runner-supported Python we can get, for the widest glibc
          # compatibility on the Linux build.
          python-version: "3.11"

      - name: install pyinstaller
        run: python -m pip install --quiet pyinstaller pytest

      - name: tests must pass before anything is built
        run: python -m pytest tests/ -q

      - name: this Python must carry Tk, or the window cannot be bundled
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: build single-file binary
        # The tool imports argparse, os, sys at startup, and tkinter, zlib and
        # base64 when the window opens. The exclude list is txt2dirart's minus
        # tkinter (which we need) and minus nothing zlib/base64 depend on.
        #
        # --console, not --windowed: a windowed build on Windows swallows all
        # command-line output. The cost is a console behind the window when
        # the exe is double-clicked; 1.1 can add a second windowed build.
        #
        # --strip on Linux ONLY (see matrix.strip): on Windows it corrupts the
        # bundled python311.dll (txt2dirart learned this the hard way).
        run: >
          pyinstaller --onefile --name dirarttool
          --console --noupx ${{ matrix.strip }}
          --exclude-module unittest
          --exclude-module email --exclude-module http
          --exclude-module xml --exclude-module xmlrpc
          --exclude-module pydoc --exclude-module doctest
          --exclude-module pdb --exclude-module sqlite3
          --exclude-module ssl --exclude-module hashlib
          --exclude-module lzma --exclude-module bz2
          --exclude-module socket --exclude-module multiprocessing
          --exclude-module asyncio --exclude-module logging
          --exclude-module pickle --exclude-module json
          --exclude-module csv --exclude-module decimal
          --exclude-module datetime --exclude-module calendar
          dirarttool.py

      - name: the binary must actually run
        # A PyInstaller build can succeed and still produce something that
        # cannot start. Exercise the real paths: version, a dry run, an
        # in-place replace that must match what the script produces, an
        # output file, and a refusal with its exit code.
        shell: bash
        run: |
          BIN="dist/${{ matrix.binary }}"
          "$BIN" --version
          "$BIN" tests/fixtures/baracuda-dir-file.d64 --replace D6=D1 --replace D7=D1 --dry-run
          cp tests/fixtures/baracuda-dir-file.d64 smoke-bin.d64
          cp tests/fixtures/baracuda-dir-file.d64 smoke-py.d64
          "$BIN" smoke-bin.d64 --replace D6=D1 --replace D7=D1
          python dirarttool.py smoke-py.d64 --replace D6=D1 --replace D7=D1
          cmp smoke-bin.d64 smoke-py.d64
          cp tests/fixtures/baracuda-dir-file.d64 smoke-in.d64
          "$BIN" smoke-in.d64 --replace D6=D1 -o smoke-out.d64
          cmp smoke-in.d64 tests/fixtures/baracuda-dir-file.d64     # -o left the input alone
          test -s smoke-out.d64
          # The Mask imports `random` only when it runs, so only a real run
          # proves the bundle carries it. Same seed, same mix as the script.
          cp tests/fixtures/baracuda-mask-disk.d64 mask-in.d64
          "$BIN" mask-in.d64 --mask 1 --mask-from 1-7 --seed 7 -o mask-bin.d64
          python dirarttool.py mask-in.d64 --mask 1 --mask-from 1-7 --seed 7 -o mask-py.d64
          cmp mask-bin.d64 mask-py.d64
          cmp mask-in.d64 tests/fixtures/baracuda-mask-disk.d64   # -o left the input alone
          "$BIN" smoke-in.d64 --header-from mask-in.d64 --id-from mask-in.d64 -o head-bin.d64
          python dirarttool.py smoke-in.d64 --header-from mask-in.d64 --id-from mask-in.d64 -o head-py.d64
          cmp head-bin.d64 head-py.d64
          set +e
          "$BIN" smoke-bin.d64 --replace D6=D1 --rows 7
          [ $? -eq 2 ] || { echo "::error::a row that does not exist should exit 2"; exit 1; }
          set -e
          echo "binary smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: dirarttool-${{ matrix.target }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  package:
    name: package and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: assemble the zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="dirarttool-${VERSION}"
          mkdir -p "$DIR/docs"
          cp artifacts/dirarttool-windows/dirarttool.exe "$DIR/"
          cp artifacts/dirarttool-linux/dirarttool       "$DIR/"
          chmod +x "$DIR/dirarttool"
          cp dirarttool.py README.md CHANGELOG.md LICENSE "$DIR/"
          # The README embeds this; without it the image is dead offline.
          cp docs/window.png docs/window-mask.png docs/guide-he.html "$DIR/docs/"
          # Baracuda's test disk: the example the README walks through.
          cp tests/fixtures/baracuda-dir-file.d64 "$DIR/example-baracuda.d64"
          # His second disk: a stamp full of 1s, the example for the Mask.
          cp tests/fixtures/baracuda-mask-disk.d64 "$DIR/example-mask.d64"
          zip -r -q "${DIR}.zip" "$DIR"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=${DIR}.zip"   >> "$GITHUB_ENV"
          unzip -l "${DIR}.zip"
          # A file the zip is supposed to carry going missing must fail the build.
          required="dirarttool dirarttool.exe dirarttool.py README.md CHANGELOG.md LICENSE"
          required="$required docs/window.png docs/window-mask.png docs/guide-he.html example-baracuda.d64 example-mask.d64"
          listing=$(unzip -Z1 "${DIR}.zip")
          for f in $required; do
            echo "$listing" | grep -qxF "${DIR}/${f}" || { echo "::error::missing from the zip: $f"; exit 1; }
          done
          echo "zip contents verified"

      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: dirarttool ${{ env.VERSION }}
          body_path: CHANGELOG.md
          # A tag with a suffix (v1.0.0-rc1) is a trial run, not a release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ env.ZIP }}
